<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Free AI Tools for YouTube Thumbnails 2026</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-card: #13131c;
    --bg-card-hover: #191926;
    --cyan: #00d4ff;
    --cyan-dim: rgba(0, 212, 255, 0.15);
    --text: #e6e6f0;
    --text-dim: #9a9ab0;
    --border: #22222f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }

  a { color: var(--cyan); text-decoration: none; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--cyan); }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--cyan); }

  /* Hero */
  .hero {
    text-align: center;
    padding: 90px 24px 60px;
    background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.1), transparent 60%);
  }

  .badge {
    display: inline-block;
    background: var(--cyan-dim);
    border: 1px solid rgba(0, 212, 255, 0.4);
    color: var(--cyan);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 30px;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.2;
    max-width: 850px;
    margin: 0 auto 18px;
    letter-spacing: -1px;
  }

  .hero h1 span { color: var(--cyan); }

  .hero p {
    color: var(--text-dim);
    font-size: 18px;
    max-width: 650px;
    margin: 0 auto;
  }

  /* Section titles */
  .section {
    padding: 70px 0;
  }

  .section-title {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
    text-align: center;
  }

  .section-sub {
    color: var(--text-dim);
    text-align: center;
    max-width: 600px;
    margin: 0 auto 50px;
    font-size: 16px;
  }

  /* Article */
  .article {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 45px;
  }

  .article h2 {
    font-size: 28px;
    color: var(--cyan);
    margin-bottom: 18px;
  }

  .article p {
    color: var(--text-dim);
    margin-bottom: 20px;
    font-size: 16px;
  }

  .article h3 {
    font-size: 20px;
    margin: 28px 0 12px;
    color: var(--text);
  }

  .article ul {
    margin: 0 0 20px 22px;
    color: var(--text-dim);
  }

  .article ul li { margin-bottom: 8px; }

  .article strong { color: var(--text); }

  /* Cards grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    transition: transform 0.25s, border-color 0.25s, background 0.25s;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: var(--cyan);
    background: var(--bg-card-hover);
  }

  .card-rank {
    position: absolute;
    top: 18px;
    right: 20px;
    font-size: 13px;
    color: var(--cyan);
    font-weight: 700;
    border: 1px solid rgba(0,212,255,0.4);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--cyan-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 18px;
  }

  .card h3 {
    font-size: 20px;
    margin-bottom: 8px;
    color: var(--text);
  }

  .card p {
    color: var(--text-dim);
    font-size: 14.5px;
    margin-bottom: 16px;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tag {
    font-size: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .price {
    color: var(--cyan);
    font-weight: 700;
    font-size: 14px;
  }

  .btn-link {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn-link:hover { color: var(--cyan); }

  /* YouTube Package Section */
  .yt-section {
    background: linear-gradient(180deg, rgba(0,212,255,0.04), transparent);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .pkg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }

  .pkg-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 30px;
    text-align: center;
    position: relative;
  }

  .pkg-card.featured {
    border: 2px solid var(--cyan);
    background: linear-gradient(180deg, rgba(0,212,255,0.08), var(--bg-card));
    transform: scale(1.03);
  }

  .pkg-tag {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--cyan);
    color: #06121a;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 16px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .pkg-card h3 {
    font-size: 22px;
    margin-bottom: 10px;
  }

  .pkg-price {
    font-size: 40px;
    font-weight: 800;
    color: var(--cyan);
    margin: 14px 0 6px;
  }

  .pkg-price span {
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 400;
  }

  .pkg-card p.pkg-desc {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .pkg-features {
    list-style: none;
    text-align: left;
    margin-bottom: 30px;
  }

  .pkg-features li {
    padding: 8px 0;
    color: var(--text-dim);
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px dashed var(--border);
  }

  .pkg-features li::before {
    content: "✓";
    color: var(--cyan);
    font-weight: 800;
  }

  .pkg-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
  }

  .pkg-btn.filled {
    background: var(--cyan);
    color: #06121a;
  }

  .pkg-btn:hover {
    background: var(--cyan);
    color: #06121a;
  }

  /* Comparison table */
  .table-wrap {
    overflow-x: auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-top: 50px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
  }

  th, td {
    padding: 16px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }

  th {
    color: var(--cyan);
    font-weight: 700;
    background: rgba(0,212,255,0.05);
  }

  td { color: var(--text-dim); }

  tr:last-child td { border-bottom: none; }

  /* Footer */
  footer {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13.5px;
    border-top: 1px solid var(--border);
  }

  footer a { color: var(--cyan); }

  @media (max-width: 768px) {
    .hero h1 { font-size: 32px; }
    .nav-links { display: none; }
    .pkg-card.featured { transform: none; }
    .article { padding: 28px; }
  }
</style>
</head>

<header>
  <
