<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Free AI Tools for YouTube Thumbnails 2026</title>
<style>
  :root {
    --bg-dark: #0a0e14;
    --bg-card: #121823;
    --bg-card-hover: #161f2e;
    --accent: #00d4ff;
    --accent-dim: rgba(0, 212, 255, 0.15);
    --text-main: #e8edf3;
    --text-muted: #8a97a8;
    --border-color: #1f2a3a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.7;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  header {
    background: linear-gradient(180deg, #0d1420 0%, #0a0e14 100%);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .navbar {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
  }

  .logo {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .logo span {
    color: var(--accent);
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 28px;
  }

  nav a {
    color: var(--text-muted);
    font-weight: 500;
    transition: color 0.2s;
  }

  nav a:hover {
    color: var(--accent);
  }

  .hero {
    text-align: center;
    padding: 90px 24px 60px;
    max-width: 900px;
    margin: 0 auto;
  }

  .badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 20px;
    border: 1px solid rgba(0, 212, 255, 0.3);
  }

  .hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    margin-bottom: 18px;
    line-height: 1.2;
  }

  .hero h1 span {
    color: var(--accent);
  }

  .hero p {
    color: var(--text-muted);
    font-size: 1.1rem;
    max-width: 650px;
    margin: 0 auto;
  }

  section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .section-title {
    text-align: center;
    margin-bottom: 45px;
  }

  .section-title h2 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .section-title p {
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
  }

  .section-title .accent-line {
    width: 60px;
    height: 3px;
    background: var(--accent);
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* Article Section */
  .article-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 40px;
  }

  .article-box h2 {
    font-size: 1.9rem;
    margin-bottom: 16px;
    color: var(--text-main);
  }

  .article-box h2 span {
    color: var(--accent);
  }

  .article-box p {
    color: var(--text-muted);
    margin-bottom: 18px;
  }

  .article-box h3 {
    color: var(--accent);
    font-size: 1.2rem;
    margin: 28px 0 10px;
  }

  .article-box ul {
    margin-left: 20px;
    color: var(--text-muted);
  }

  .article-box ul li {
    margin-bottom: 8px;
  }

  .article-box ul li strong {
    color: var(--text-main);
  }

  /* Tool Cards Grid */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }

  .tool-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 26px;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
  }

  .tool-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(0, 212, 255, 0.12);
  }

  .tool-rank {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-bottom-left-radius: 10px;
  }

  .tool-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #0077ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    color: #04131a;
    margin-bottom: 16px;
  }

  .tool-card h3 {
    font-size: 1.25rem;
    margin-bottom: 8px;
    color: var(--text-main);
  }

  .tool-card p.desc {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .tag {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .tool-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 14px;
  }

  .price {
    font-weight: 700;
    color: var(--accent);
  }

  .btn-small {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .btn-small:hover {
    background: var(--accent);
    color: #04131a;
  }

  /* YouTube Package Section */
  .yt-section {
    background: linear-gradient(180deg, #0a0e14, #0d1522);
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
  }

  .package-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .package-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    position: relative;
    transition: transform 0.25s;
  }

  .package-card:hover {
    transform: translateY(-6px);
  }

  .package-card.featured {
    border: 2px solid var(--accent);
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
  }

  .featured-badge {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #04131a;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .package-card h3 {
    font-size: 1.3rem;
    margin-bottom: 10px;
  }

  .package-price {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .package-price span {
    font-size: 1rem;
    color: var(--text-muted);
    font-weight: 400;
  }

  .package-card ul {
    list-style: none;
    margin: 22px 0;
    text-align: left;
  }

  .package-card ul li {
    padding: 8px 0;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .package-card ul li::before {
    content: "✓";
    color: var(--accent);
    font-weight: 700;
  }

  .btn-main {
    display: inline-block;
    width: 100%;
    padding: 12px 0;
    background: var(--accent);
    color: #04131a;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-main:hover {
    opacity: 0.85;
  }

  .btn-outline {
    display: inline-block;
    width: 100%;
    padding: 12px 0;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .btn-outline:hover {
    background: var(--accent);
    color: #04131a;
  }

  footer {
    text-align: center;
    padding: 40px 24px;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
    font-size: 0.9rem;
  }

  footer span {
    color: var(--accent);
  }

  @media (max-width: 600px) {
    .hero h1 { font-size: 2rem; }
    .article-box { padding: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Thumb<span>AI</span>Hub</div>
    <nav>
      <ul>
        <li><a href="#tools">Tools</a></li>
        <li><a href="#article">Guide</a></li>
        <li><a href="#packages">Packages</a></li>
      </ul>
    </nav>
  </div
