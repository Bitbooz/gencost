<script>
const allData = {"heygen-pricing.json": {"platform": "heygen", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 3, "unit": "videos", "offer": "2 months free on yearly"}, {"name": "Creator", "monthly_price_usd": 29, "credits_or_minutes": 600, "unit": "credits", "offer": "2 months free on yearly"}, {"name": "Pro", "monthly_price_usd": 49, "credits_or_minutes": 1000, "unit": "credits", "offer": "2 months free on yearly"}]}, "higgsfield-pricing.json": {"platform": "Higgsfield", "plans": [{"name": "Starter", "monthly_price_usd": 19, "credits_or_minutes": 270, "unit": "credits"}, {"name": "Plus", "monthly_price_usd": 59, "credits_or_minutes": 1200, "unit": "credits"}, {"name": "Ultra", "monthly_price_usd": 129, "credits_or_minutes": 3000, "unit": "credits"}]}, "runway-pricing.json": {"platform": "runway", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 125, "unit": "credits", "offer": "Free forever"}, {"name": "Standard", "monthly_price_usd": 12, "credits_or_minutes": 625, "unit": "credits", "offer": "Save /year"}, {"name": "Pro", "monthly_price_usd": 28, "credits_or_minutes": 2250, "unit": "credits", "offer": "Save /year"}, {"name": "Max", "monthly_price_usd": 76, "credits_or_minutes": 9500, "unit": "credits", "offer": "Save /year"}]}, "kling-pricing.json": {"platform": "Kling AI", "plans": [{"name": "Standard", "monthly_price_usd": 10, "credits_or_minutes": 660, "unit": "credits"}, {"name": "Pro", "monthly_price_usd": 37, "credits_or_minutes": 3000, "unit": "credits"}, {"name": "Premier", "monthly_price_usd": 92, "credits_or_minutes": 8000, "unit": "credits"}]}, "synthesia-pricing.json": {"platform": "synthesia", "plans": [{"name": "Basic", "monthly_price_usd": 0, "credits_or_minutes": 500, "unit": "credits", "offer": "Save up to 4 months with yearly"}, {"name": "Starter", "monthly_price_usd": 29, "credits_or_minutes": 1250, "unit": "credits", "offer": "Save up to 4 months with yearly"}, {"name": "Pro", "monthly_price_usd": 89, "credits_or_minutes": 6000, "unit": "credits", "offer": "Save up to 4 months with yearly"}]}, "pika-pricing.json": {"platform": "pika", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 0, "unit": "credits", "offer": "Save 20% on yearly"}, {"name": "Starter", "monthly_price_usd": 10, "credits_or_minutes": 900, "unit": "credits", "offer": "Save 20% on yearly"}, {"name": "Creator", "monthly_price_usd": 35, "credits_or_minutes": 3150, "unit": "credits", "offer": "Save 20% on yearly"}, {"name": "Fancy", "monthly_price_usd": 95, "credits_or_minutes": 8550, "unit": "credits", "offer": "Save 20% on yearly"}]}, "luma-pricing.json": {"platform": "luma", "plans": [{"name": "Plus", "monthly_price_usd": 30, "credits_or_minutes": 10000, "unit": "credits", "offer": "Save up to 20% with yearly"}, {"name": "Pro", "monthly_price_usd": 90, "credits_or_minutes": 40000, "unit": "credits", "offer": "Save up to 20% with yearly"}, {"name": "Ultra", "monthly_price_usd": 300, "credits_or_minutes": 150000, "unit": "credits", "offer": "Save up to 20% with yearly"}]}, "viggle-pricing.json": {"platform": "viggle", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 0, "unit": "credits", "offer": "-20% on yearly"}, {"name": "Pro", "monthly_price_usd": 7.99, "credits_or_minutes": 80, "unit": "credits", "offer": "-20% on yearly"}, {"name": "Live", "monthly_price_usd": 15.99, "credits_or_minutes": 200, "unit": "credits", "offer": "-20% on yearly"}, {"name": "Max", "monthly_price_usd": 63.99, "credits_or_minutes": 800, "unit": "credits", "offer": "-20% on yearly"}]}, "invideo-pricing.json": {"platform": "invideo", "plans": [{"name": "Starter", "monthly_price_usd": 10, "credits_or_minutes": 400, "unit": "credits", "offer": "50% off on annual, unlimited images for 30 days, extra discount after signup"}, {"name": "Plus", "monthly_price_usd": 30, "credits_or_minutes": 2000, "unit": "credits", "offer": "50% off on annual, unlimited images for 30 days, extra discount after signup"}, {"name": "Max", "monthly_price_usd": 75, "credits_or_minutes": 5000, "unit": "credits", "offer": "50% off on annual, unlimited images for 30 days, extra discount after signup"}]}, "capcut-pricing.json": {"platform": "capcut", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 0, "unit": "credits", "offer": "up to 40% off"}, {"name": "Pro", "monthly_price_usd": 399, "credits_or_minutes": 1200, "unit": "credits", "offer": "up to 40% off, yearly 3990 NOK"}, {"name": "Ultra", "monthly_price_usd": 750, "credits_or_minutes": 8645, "unit": "credits", "offer": "up to 40% off, yearly 8590 NOK"}]}, "ltx-pricing.json": {"platform": "ltx", "plans": [{"name": "Free", "monthly_price_usd": 0, "credits_or_minutes": 800, "unit": "credits", "offer": "800 credits one time"}, {"name": "Lite", "monthly_price_usd": 15, "credits_or_minutes": 8000, "unit": "credits", "offer": "Save 50% for Cyber Monday, Billed yearly , UNLIMITED FLUX.2 GENERATIONS, Exclusive limited time offer"}, {"name": "Standard", "monthly_price_usd": 35, "credits_or_minutes": 28000, "unit": "credits", "offer": "Save 50% for Cyber Monday, Billed yearly , 28,800 additional Computing Seconds / month for the first 3 months, Exclusive limited time offer"}, {"name": "Pro", "monthly_price_usd": 125, "credits_or_minutes": 110000, "unit": "credits", "offer": "Save 50% for Cyber Monday, Billed yearly ,200, Exclusive limited time offer"}]}};

function cleanName(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("heygen")) return "HeyGen";
  if (n.includes("kling")) return "Kling AI";
  if (n.includes("ltx")) return "LTX Studio";
  if (n.includes("invideo")) return "InVideo";
  if (n.includes("capcut")) return "CapCut";
  if (n.includes("higgs")) return "Higgsfield";
  if (n.includes("runway")) return "Runway";
  if (n.includes("synth")) return "Synthesia";
  if (n.includes("pika")) return "Pika";
  if (n.includes("luma")) return "Luma";
  if (n.includes("viggle")) return "Viggle";
  return name;
}

function getPage(name) {
  const map = {
    "HeyGen": "pages/heygen.html",
    "Higgsfield": "pages/higgsfield.html",
    "Runway": "pages/runway.html",
    "Kling AI": "pages/kling.html",
    "Synthesia": "pages/synthesia.html",
    "Pika": "pages/pika.html",
    "Luma": "pages/luma.html",
    "Viggle": "pages/viggle.html",
    "InVideo": "pages/invideo.html",
    "CapCut": "pages/capcut.html",
    "LTX Studio": "pages/ltx.html"
  };
  return map[name] || "#";
}

function estimateCost(plan) {
  const price = plan.monthly_price_usd || 0;
  const credits = plan.credits_or_minutes || 0;
  if (!price || !credits || credits <= 0) return "";
  const costPer10s = (price / credits) * 10;
  if (costPer10s < 0.01) return "";
  return  (~pwd{costPer10s.toFixed(2)} / 10s);
}

function createParticles(e) {
  e.preventDefault();
  const link = e.currentTarget;
  const card = link.closest('.card');
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 5;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;
    card.appendChild(p);
    let px = x, py = y, life = 1;
    function anim() {
      life -= 0.018;
      if (life <= 0) { p.remove(); return; }
      px += dx;
      py += dy;
      p.style.left = px + 'px';
      p.style.top = py + 'px';
      p.style.opacity = life;
      requestAnimationFrame(anim);
    }
    anim();
  }
  setTimeout(() => { window.location.href = link.href; }, 280);
}

const order = ["HeyGen", "Higgsfield", "Runway", "Kling AI", "Synthesia", "Pika", "Luma", "Viggle", "InVideo", "CapCut", "LTX Studio"];
const content = document.getElementById("content");

const platforms = [];
for (const [file, data] of Object.entries(allData)) {
  if (!data) continue;
  const raw = data.platform || file.replace("-pricing.json","");
  const name = cleanName(raw);
  platforms.push({ name, data });
}

platforms.sort((a, b) => {
  const ai = order.indexOf(a.name);
  const bi = order.indexOf(b.name);
  if (ai === -1 && bi === -1) return a.name.localeCompare(b.name);
  if (ai === -1) return 1;
  if (bi === -1) return -1;
  return ai - bi;
});

for (const { name, data } of platforms) {
  const page = getPage(name);
  let html = <div class="card"><h2><a href="" onclick="createParticles(event)"></a></h2>;
  for (const plan of data.plans || []) {
    const price = plan.monthly_price_usd ?? 0;
    const credits = plan.credits_or_minutes ?? "-";
    const unit = plan.unit || "";
    const est = estimateCost(plan);
    html += <div class="plan"><strong></strong>: pwd{price}/mo ·  <span class="cost"></span></div>;
  }
  html += "</div>";
  content.innerHTML += html;
}
