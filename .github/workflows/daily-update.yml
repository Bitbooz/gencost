name: Daily Price Update

# Runs every morning at 06:00 UTC (07:00 Norwegian winter time),
# or by hand: GitHub -> Actions -> Daily Price Update -> Run workflow.
#
# ONE-TIME SETUP: add your xAI key as a secret named XAI_API_KEY
# (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai tzdata

      - name: Update prices (scrape, extract with Grok, check, rebuild site data)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python auto_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A *-pricing.json voice music data price-review.txt *-raw.txt
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update prices $(TZ=Europe/Oslo date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
