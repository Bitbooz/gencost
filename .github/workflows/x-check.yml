name: Check X keys

# By hand: GitHub -> Actions -> Check X keys -> Run workflow.
# Checks that the four X secrets work, by reading @bitbooz's own profile. Never posts anything.

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Also post GenCost's first hello post on X (about $0.015)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check the X keys (no post)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python x_post.py --check

      - name: Post the hello post (only if "post" was ticked)
        if: inputs.post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python x_post.py --hello
