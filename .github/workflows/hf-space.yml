name: Hugging Face Space

# Publishes the space/ folder as the Hugging Face Space Bitbooz/ai-price-finder (free CPU).
# Runs by itself when space/ changes; or by hand: Actions -> Hugging Face Space -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["space/**", ".github/workflows/hf-space.yml"]

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub pandas "gradio[mcp]"
      - name: Test the app against today's live data
        working-directory: space
        run: |
          python -c "import app; print(app.clip_cost('Kling 4.0', 10, 5)[:400]); print(app.cheapest_plans('voice', 3)[:300])"
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          V=$(python -c "import gradio; print(gradio.__version__)")
          echo "Gradio $V"
          sed -i "s/SDK_VERSION/$V/" space/README.md
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          rid = "Bitbooz/ai-price-finder"
          api.create_repo(rid, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=rid, repo_type="space",
                            commit_message="Update from GitHub Bitbooz/gencost", ignore_patterns=["__pycache__/*"])
          for _ in range(30):
              stage = api.get_space_runtime(rid).stage
              print("Space stage:", stage)
              if stage in ("RUNNING", "BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  break
              time.sleep(20)
          print("https://huggingface.co/spaces/" + rid)
          if stage != "RUNNING":
              raise SystemExit("The Space did not start: " + stage)
          PY
